[project]
name = "carfac-ephys"
version = "0.2.0"
description = "Simulating animal cochlear impairment electrophysiology with CARFAC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "carfac[jax] @ git+https://github.com/google/carfac@4cdb95eefd2161bc0c64566d2ee3f05637a00d51#subdirectory=python",
    "flax>=0.12.0",
    "jax>=0.10.1",
    "jaxlib>=0.10.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "click>=8.1.0",
    "pytest>=8.0.0",
]

[project.scripts]
carfac-ephys-simulate = "carfac_ephys.cli:main"
carfac-ephys-explorer = "carfac_ephys.explorer_api:main"

[project.optional-dependencies]
explorer = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.20",
  "soundfile>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "httpx>=0.28",
  "ruff>=0.16",
  "pyrefly>=1.2.0",
  "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, the active pylint checks, RUF100, and Google docstrings.
select = ["E", "W", "F", "I", "PLC", "PLE", "PLW", "RUF100", "D"]
ignore = [
  "PLW0603", # global statements, as in the Google pylintrc
  "PLW0120", # else clause on loop, as in the Google pylintrc
  "D105", # magic methods do not need docstrings
  "D107", # __init__ is documented in the class docstring
  "D203", # conflicts with D211 (no blank line before class docstring)
  "D213", # conflicts with D212 (summary on the first line)
  "E501", # accept the formatter's best-effort wrapping (long strings/URLs stay)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: docstrings optional; lazy imports inside test methods are normal.
"tests/**" = ["D", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["carfac_ephys"]

[tool.pyrefly]
project-includes = ["src/carfac_ephys", "tests"]
search-path = ["src"]
python-version = "3.11"
project-excludes = ["**/.venv", "**/.git", "**/output"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
